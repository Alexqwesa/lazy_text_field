name: lazy_text_field

on:
  push:
    branches: [main, master]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
      - '.github/workflows/lazy_text_field.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
      - '.github/workflows/lazy_text_field.yml'

jobs:
  test:
    name: Flutter ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Codecov OIDC tokenless upload on public repos.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.38.0 shipped Dart 3.10.0-*.beta (does not satisfy sdk: ^3.10.0).
          # 3.38.1 is the first patch with a stable Dart 3.10+.
          - name: minimum-3.38.1
            flutter-version: 3.38.1
            channel: stable
          - name: stable
            flutter-version: 3.44.8
            channel: stable

    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter-version }}
          channel: ${{ matrix.channel }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test with coverage
        run: flutter test --coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov-${{ matrix.name }}
          path: coverage/lcov.info
          if-no-files-found: error

      - name: Upload coverage to Codecov
        if: matrix.name == 'stable'
        uses: codecov/codecov-action@v5
        with:
          files: coverage/lcov.info
          flags: flutter
          name: flutter-stable
          token: ${{ secrets.CODECOV_TOKEN }}
          use_oidc: true
          fail_ci_if_error: false

